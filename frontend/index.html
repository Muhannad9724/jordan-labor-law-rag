<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="pageTitle">دليل قانون العمل والضمان الاجتماعي الأردني</title>
  <!-- Runs before style.css paints anything, so the page never flashes the default
       dark theme and then swaps to a stored/system light preference a moment later.
       Kept tiny and duplicated from app.js's own theme init on purpose -- this has to
       run synchronously pre-paint, before app.js (loaded at the end of body) exists. -->
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- ?v= is a cache buster. Without it the browser keeps serving the css/js it
       already has and a deploy looks like it silently did nothing. Bump on change. -->
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div class="shell">

    <header class="masthead">
      <svg class="seal" viewBox="0 0 28 28" aria-hidden="true">
        <polygon points="14,2 16.39,9.04 23.38,6.52 19.36,12.78 25.70,16.67 18.30,17.43 19.21,24.81 14,19.5 8.79,24.81 9.70,17.43 2.30,16.67 8.64,12.78 4.62,6.52 11.61,9.04" />
      </svg>

        <h1 data-i18n="h1">دليل قانون العمل والضمان الاجتماعي</h1>
        <p class="tagline" data-i18n="tagline">اسأل بالعربية أو الإنجليزية — كل إجابة مستندة إلى نصّ المادة القانونية ومصدرها</p>
      </div>
      <div class="masthead-laws">
        <span data-i18n="lawLabor96">قانون العمل ١٩٩٦</span>
        <span data-i18n="lawProf19">العمل المهني ٢٠١٩</span>
        <span data-i18n="lawSsl">الضمان الاجتماعي</span>
      </div>
      <div class="toggle-group">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4.5"></line>
            <line x1="12" y1="19.5" x2="12" y2="22"></line>
            <line x1="4.22" y1="4.22" x2="5.95" y2="5.95"></line>
            <line x1="18.05" y1="18.05" x2="19.78" y2="19.78"></line>
            <line x1="2" y1="12" x2="4.5" y2="12"></line>
            <line x1="19.5" y1="12" x2="22" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.95" y2="18.05"></line>
            <line x1="18.05" y1="5.95" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Switch to English" title="Switch to English">EN</button>
      </div>
    </header>

    <div class="workspace">

      <section class="conversation">
        <div class="thread" id="thread" aria-live="polite"></div>

        <!-- Suggestions and the composer share one sticky dock so the chips always sit
             directly on the question bar, visible without scrolling. -->
        <div class="composer-dock">
        <div class="suggestions-dock" id="suggestions-dock" hidden></div>

        <form class="composer" id="composer">
          <button type="button" id="reset-btn" data-i18n-aria="resetLabel" data-i18n-title="resetTitle" aria-label="محادثة جديدة" title="بدء محادثة جديدة">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span class="reset-label" data-i18n="resetLabel">محادثة جديدة</span>
          </button>
          <textarea
            id="question-input"
            data-i18n-placeholder="placeholder"
            placeholder="اكتب سؤالك هنا… مثلاً: كم مدة الإشعار قبل إنهاء عقد العمل؟"
            rows="1"
            required
          ></textarea>
          <button type="submit" id="send-btn" data-i18n-aria="sendAria" aria-label="إرسال">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 5 5 12 12 19"></polyline>
            </svg>
          </button>
        </form>
        </div>
      </section>

      <aside class="sources-rail" id="sources-rail">
        <header class="rail-head">
          <h2 data-i18n="railHead">المواد المستند إليها</h2>
          <span class="rail-count" id="rail-count"></span>
        </header>
        <div class="rail-body" id="rail-body"></div>
      </aside>

    </div>

    <footer class="site-footer">
      <p class="disclaimer" data-i18n="disclaimer">
        هذه معلومات عامة وليست استشارة قانونية — يُرجى مراجعة محامٍ مرخّص لحالتك الخاصة
      </p>
      <a
        class="contact-link"
        href="https://www.linkedin.com/in/muhannad-alsaleh-077047180/"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n-aria="contactAria"
        aria-label="تواصل معي عبر لينكدإن"
      >
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
        </svg>
        <span data-i18n="contactLabel">تواصل معي عبر لينكدإن</span>
      </a>
    </footer>

  </div>

  <script src="markdown.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
